spring.application.name=datashare

# Schema is owned by Flyway; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secrets come from .env (not versioned), see .env.example
spring.config.import=optional:file:.env[.properties]
# No default value: the API refuses to start without a key
datashare.jwt.secret=${JWT_SECRET}

# Uploaded files, named by their UUID; relative paths start from back/
datashare.storage.directory=${STORAGE_DIRECTORY:uploads}

# Expired files are removed from disk every hour (second minute hour day month weekday).
# Hourly because a development laptop is off at night; a server that never stops can run it once a day
datashare.purge.cron=${PURGE_CRON:0 0 * * * *}

# Spring rejects uploads over 1 MB by default; the spec allows 1 GB per file.
# The request also carries the other form fields, hence a slightly higher limit
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1025MB

# Console stays human-readable; the file gets one JSON object per line (Elastic Common Schema)
# for analysis. Spring rolls it at 10 MB and keeps 7 days
logging.file.name=${LOG_FILE:logs/datashare.log}
logging.structured.format.file=ecs
