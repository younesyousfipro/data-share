# Serves the production build for Lighthouse: ng serve sends unminified, uncompressed code
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Angular routes (/login, /download/...) are not files: the app handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Inside the container, "localhost" is the container itself: the API runs on the host
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
    }
}
