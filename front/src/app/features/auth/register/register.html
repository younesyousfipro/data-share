<section class="card" aria-labelledby="register-title">
  <h1 id="register-title" class="card-title">Créer un compte</h1>

  <form class="form" [formGroup]="form" (ngSubmit)="submit()">
    @if (serverError(); as error) {
      <p class="callout-error" role="alert">{{ error }}</p>
    }

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="Saisissez votre email..."
        (blur)="trimEmail()"
        [attr.aria-invalid]="emailError() !== null"
        [attr.aria-describedby]="emailError() ? 'email-error' : null"
      />
      @if (emailError(); as error) {
        <p id="email-error" class="field-error">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Saisissez votre mot de passe..."
        [attr.aria-invalid]="passwordError() !== null"
        [attr.aria-describedby]="passwordError() ? 'password-error' : null"
      />
      @if (passwordError(); as error) {
        <p id="password-error" class="field-error">{{ error }}</p>
      }
    </div>

    <div class="field">
      <label for="confirm-password">Vérification du mot de passe</label>
      <input
        id="confirm-password"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Saisissez-le à nouveau"
        [attr.aria-invalid]="confirmPasswordError() !== null"
        [attr.aria-describedby]="confirmPasswordError() ? 'confirm-password-error' : null"
      />
      @if (confirmPasswordError(); as error) {
        <p id="confirm-password-error" class="field-error">{{ error }}</p>
      }
    </div>

    <a class="link" routerLink="/login">J'ai déjà un compte</a>
    <button class="button-primary" type="submit">Créer mon compte</button>
  </form>
</section>
