<section class="card" aria-labelledby="download-title">
  <h1 id="download-title" class="card-title">Télécharger un fichier</h1>

  @if (metadata(); as metadata) {
    <div class="download">
      <div class="file">
        <svg class="file-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
          <path d="M14 2v4a2 2 0 0 0 2 2h4" />
        </svg>
        <p class="file-details">
          <span class="file-name" [title]="metadata.originalName">{{ metadata.originalName }}</span>
          <span class="file-size">{{ metadata.sizeBytes | fileSize }}</span>
        </p>
      </div>

      @if (expiry(); as expiry) {
        <p [class]="expiry.warning ? 'callout-warning' : 'callout-info'">{{ expiry.text }}</p>
      }
    </div>
  } @else if (unavailableMessage(); as message) {
    <p class="callout-error" role="alert">{{ message }}</p>
  } @else {
    <p class="loading" role="status">Chargement…</p>
  }
</section>
