# SonarQube analysis, see MAINTENANCE.md; the token comes from the SONAR_TOKEN variable
# Explicit: without it, recent scanners default to SonarQube Cloud
sonar.host.url=http://localhost:9000
sonar.projectKey=datashare-front
sonar.projectName=DataShare front
sonar.sourceEncoding=UTF-8

# Unit tests live next to the code: specs are removed from the sources and declared as tests
sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src,cypress
sonar.test.inclusions=**/*.spec.ts,cypress/**

# Produced by npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/datashare/lcov.info
# Same exclusions as the Vitest thresholds (angular.json), so both tools report the same coverage
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,src/app/app.routes.ts
